<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Guesvia" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gv-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAF4FF"/>
      <stop offset="100%" stop-color="#CFE8FA"/>
    </linearGradient>
    <linearGradient id="gv-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F58A3C"/>
    </linearGradient>
    <linearGradient id="gv-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B5CFF"/>
      <stop offset="100%" stop-color="#17B8C6"/>
    </linearGradient>
    <clipPath id="gv-clip"><circle cx="48" cy="48" r="38"/></clipPath>
  </defs>

  <!-- badge -->
  <circle cx="48" cy="48" r="38" fill="url(#gv-sky)"/>

  <g clip-path="url(#gv-clip)">
    <!-- sun -->
    <circle cx="44" cy="52" r="15" fill="url(#gv-sun)"/>
    <!-- horizon water -->
    <path d="M10 62c8 0 8 5 16 5s8-5 16-5 8 5 16 5 8-5 16-5 8 5 16 5v26H10z" fill="url(#gv-wave)" opacity=".9"/>
    <path d="M10 71c8 0 8 4.5 16 4.5S34 71 42 71s8 4.5 16 4.5S66 71 74 71s8 4.5 16 4.5V90H10z" fill="#0B5CFF" opacity=".55"/>
  </g>

  <!-- palm trunk -->
  <path d="M60 74c-1.5-9 .5-17.5 5-24" stroke="#1B5E3A" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- palm fronds -->
  <g fill="#2FBE7A">
    <path d="M65 50c-7-6-16-6-21 0 7-2 14-1 21 0z"/>
    <path d="M65 50c-2-8-9-13-16-12 6 3 11 7 16 12z"/>
    <path d="M65 50c6-7 15-8 21-3-7-1-14 0-21 3z"/>
    <path d="M65 50c3-8 10-12 17-11-6 3-12 6-17 11z"/>
  </g>
  <circle cx="65" cy="50" r="3" fill="#1B5E3A"/>

  <!-- outer ring -->
  <circle cx="48" cy="48" r="38" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <circle cx="48" cy="48" r="40.5" fill="none" stroke="#DBE8FF" stroke-width="1.5"/>
</svg>
