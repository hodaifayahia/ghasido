<!doctype html>
<!--
    Shown by the service worker (public/sw.js) when the installed app or a tab
    has no connection. Static, so it cannot load app.css: the colours below
    are the @theme token values from resources/css/app.css (app, surface,
    brand-600, brand-700, ink-royal, ink-slate, line), laid out like
    resources/views/errors/403.blade.php.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#ffffff" />
        <title>You are offline - GHASIDO</title>
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <style>
            html {
                background-color: #f4f9fe;
            }
            body {
                margin: 0;
                font-family: Inter, ui-sans-serif, system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            main {
                display: flex;
                min-height: 100svh;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 24px;
                padding: 48px 24px;
                text-align: center;
                box-sizing: border-box;
            }
            img {
                width: 176px;
                height: auto;
            }
            .eyebrow {
                margin: 0;
                color: #1249c9;
                font:
                    600 14px/1.4 Poppins,
                    ui-sans-serif,
                    system-ui,
                    sans-serif;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }
            h1 {
                margin: 8px 0 0;
                color: #110da8;
                font:
                    700 28px/40px Poppins,
                    ui-sans-serif,
                    system-ui,
                    sans-serif;
                letter-spacing: -0.02em;
            }
            p.text {
                max-width: 28rem;
                margin: 8px 0 0;
                color: #737ba9;
                font-size: 16px;
                line-height: 28px;
            }
            button {
                height: 44px;
                padding: 0 20px;
                border: 0;
                border-radius: 10px;
                background: #0b5cff;
                box-shadow: 0 2px 8px rgb(11 92 255 / 0.28);
                color: #ffffff;
                font:
                    600 14px Poppins,
                    ui-sans-serif,
                    system-ui,
                    sans-serif;
                cursor: pointer;
            }
            button:hover {
                background: #1249c9;
            }
            button:focus-visible {
                outline: none;
                box-shadow: 0 0 0 3px rgb(11 92 255 / 0.15);
            }
        </style>
    </head>
    <body>
        <main>
            <img
                src="/brand/ghasido-logo.png"
                alt="GHASIDO"
                width="690"
                height="205"
            />
            <div>
                <p class="eyebrow">No connection</p>
                <h1>You are offline</h1>
                <p class="text">
                    Your progress is saved on the server. Check your Wi-Fi or
                    mobile data, then try again.
                </p>
            </div>
            <button type="button" onclick="location.reload()">Try again</button>
        </main>
    </body>
</html>
